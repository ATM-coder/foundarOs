      /* Hero legibility floor: media heroes and authored data-dark-hero

         decorative illustration nested in a layout column must never trigger
         the veil (the recurring "greyed-out hero" bug). The veil uses z-index

        // caught (those never reach `window`, so they never got here at all).

        //

        // bubble-phase listener directly above never sees them — and
        // reportRuntimeErrorToServer explicitly filters image 404s out anyway

        // A dead <img src> therefore had no path to the server at all until a

        // that the user can expand via "View details". The Try-again

            '</div>' +
            detailsHtml;

          var reload = document.getElementById('__audos_reload_btn');
          if (reload) reload.onclick = function() { window.location.reload(); };
        }

        function hideLoader() {
          if (!loader || loader.classList.contains('hidden')) return;
          loader.classList.add('hidden');
          setTimeout(function() {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 300);
          try { sessionStorage.removeItem('__audos_cold_retry'); } catch(e) {}
          try { sessionStorage.removeItem('__audos_cdn_fallback'); } catch(e) {}
        }

        // Keep the secondary user-facing loading copy visible while the
        // root still hasn't rendered. Triggers regardless of fatalError.
        setTimeout(function() {
          if (root.children.length === 0) {
            var sec = document.getElementById('space-loader-secondary');
            if (sec) sec.style.display = 'block';
          }
        }, 5000);

        // Use MutationObserver to detect when React renders content. The
        // module script above can render before this script attaches the
        // observer, so check the current DOM first to avoid a loader flash.
        var observer = new MutationObserver(function(mutations) {
          if (root.children.length > 0) {
            hideLoader();
            observer.disconnect();
          }
        });

        if (root.children.length > 0) {
          hideLoader();
          return;
        }
        
        observer.observe(root, { childList: true });
        // Task #4714: the give-up deadline is progress-aware. A slow mobile
        // connection is not a broken page: until document.readyState reaches
        // 'complete' the browser is still downloading and evaluating the
        // bundle, so the deadline is deferred instead of spent. ('complete',
        // not 'loading': browsers flip to 'interactive' as soon as the markup
        // is parsed, while the inline module and its ~100 esm.sh imports are
        // still in flight — that is precisely the healthy-but-slow case.)
        // Once loading genuinely finishes we still allow a grace window for
        // React's first paint (measured ~1s after load completes) before
        // declaring failure, and an absolute ceiling guarantees a page that
        // never finishes loading (e.g. an unreachable CDN that keeps the
        // module graph pending) still recovers on its own.
        window.__audos_shell_progress_aware__ = 1;
        var __shellDeadlineStart = Date.now();
        var __SHELL_BASE_DEADLINE_MS = 8000;
        var __SHELL_POST_LOAD_GRACE_MS = 5000;
        var __SHELL_ABSOLUTE_CEILING_MS = 60000;
        var __SHELL_LOADING_POLL_MS = 500;
        var __shellLoadingDoneAt = (document.readyState === 'complete') ? Date.now() : 0;
        document.addEventListener('readystatechange', function() {
          if (!__shellLoadingDoneAt && document.readyState === 'complete') {
            __shellLoadingDoneAt = Date.now();
          }
        });
        window.addEventListener('load', function() {
          if (!__shellLoadingDoneAt) __shellLoadingDoneAt = Date.now();
        });

        // Fallback: once the page has stopped making progress and still has no
        // visible content, show recovery.
        // Task #1435: surface the underlying cause via showRecovery(reason, details)
        // so the user sees the actual error, not just an opaque spinner.
        //
        // Auto-reload guard: _cb in the URL is the primary "already retried"
        // marker. sessionStorage alone fails open in mobile private mode and
        // in-app webviews (including ChatGPT's), which previously caused an
        // infinite _cb= reload loop and 100% mobile bounce on slow pages.
        function __shellGiveUp() {
          var isTopLevel = (window === window.parent);
          // Product Run / tenant delegation iframe. Apps often mount with
          // position:fixed (out of #root's document flow), so #root.offsetHeight
          // stays ~0 even when the calendar is fully visible. Never auto-reload
          // or empty-overlay that surface — that is the Bipp "refresh" bug.
          var isDelegatedProductRun = !!(window.__TENANT_DELEGATION__ || window.__TENANT_DELEGATION_CANVAS__);
          var usingCdnFallback = /[?&]cdn=fallback/.test(window.location.search);
          var hasCacheBuster = /[?&]_cb=/.test(window.location.search);
          var alreadyTriedCdn = false;
          try { alreadyTriedCdn = !!sessionStorage.getItem('__audos_cdn_fallback'); } catch(e) {}

          // CDN fallback helper: redirect with ?cdn=fallback so the server
          // rewrites the import map from esm.sh to cdn.jsdelivr.net.
          // Top-level pages only — never Product Run iframes (location.replace
          // remounts the whole calendar) and never generic preview iframes.
          // URL cdn=fallback is the durable guard; sessionStorage is secondary.
          function tryCdnFallback() {
            if (!isTopLevel || isDelegatedProductRun || usingCdnFallback || alreadyTriedCdn) return false;
            try { sessionStorage.setItem('__audos_cdn_fallback', String(Date.now())); } catch(e) {}
            var u = new URL(window.location.href);
            u.searchParams.set('cdn', 'fallback');
            u.searchParams.set('_cb', String(Date.now()));
            window.location.replace(u.toString());
            return true;
          }

          if (fatalError) {
            // fatalError may still take one CDN hop even if _cb is present.
            if (tryCdnFallback()) return;
            showRecovery('A script error prevented the page from loading.', fatalError);
            return;
          }
          if (root.children.length === 0) {
            // Primary guard: _cb already in the URL means we already auto-reloaded.
            // Secondary: sessionStorage when available. Manual Retry button clears both.
            var alreadyRetried = hasCacheBuster;
            if (!alreadyRetried) {
              try { alreadyRetried = !!sessionStorage.getItem('__audos_cold_retry'); } catch(e) {}
            }

            if (isTopLevel && !alreadyRetried) {
              // Step 1: cold-start retry (warm the compile cache) — at most once.
              try { sessionStorage.setItem('__audos_cold_retry', String(Date.now())); } catch(e) {}
              var u = new URL(window.location.href);
              u.searchParams.set('_cb', String(Date.now()));
              window.location.replace(u.toString());
              return;
            }
            // Step 2: CDN fallback — esm.sh may be unreachable. Do not burn a
            // second reload after the _cb cold-retry hop.
            if (!hasCacheBuster && tryCdnFallback()) return;
            showRecovery('The page failed to load. This may be a network or regional issue.', 'No content rendered in the root element after the document stopped loading. The application bundle may have failed to evaluate.');
            return;
          }
          // Product Run: React mounted (children present). Fixed-position app
          // canvases leave #root at 0 height — that is success, not emptiness.
          if (isDelegatedProductRun) {
            hideLoader();
            return;
          }
          // Check if rendered content has any visible height
          var hasVisibleContent = root.offsetHeight > 50 || root.scrollHeight > 50;
          if (!hasVisibleContent) {
            showRecovery('The page loaded but appears empty.', 'The root element has children but no visible height. The component tree may have rendered null.');
            return;
          }
          // Hide loader if still showing
          hideLoader();
        }

        function __scheduleShellGiveUp(delay) {
          setTimeout(function() {
            var now = Date.now();
            // A hard script error is not "still loading" — recover right away.
            if (fatalError) { __shellGiveUp(); return; }
            // Absolute ceiling: never spin forever.
            if (now - __shellDeadlineStart >= __SHELL_ABSOLUTE_CEILING_MS) { __shellGiveUp(); return; }
            // Something rendered — the remaining checks (visible height,
            // Product Run) must still run on the normal schedule.
            if (root.children.length > 0) { __shellGiveUp(); return; }
            // Still downloading/evaluating: progress is being made, wait.
            if (document.readyState !== 'complete') {
              __scheduleShellGiveUp(__SHELL_LOADING_POLL_MS);
              return;
            }
            if (!__shellLoadingDoneAt) __shellLoadingDoneAt = now;
            var sinceLoaded = now - __shellLoadingDoneAt;
            if (sinceLoaded < __SHELL_POST_LOAD_GRACE_MS) {
              __scheduleShellGiveUp(__SHELL_POST_LOAD_GRACE_MS - sinceLoaded);
              return;
            }
            __shellGiveUp();
          }, delay);
        }
        __scheduleShellGiveUp(__SHELL_BASE_DEADLINE_MS);
      })();
    </script>
  </body>
</html>
